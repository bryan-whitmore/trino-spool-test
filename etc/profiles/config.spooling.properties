### Profile B -- SPOOLING (Trino spooled client protocol, v478)
### Workers write encoded result segments straight to VAST S3. The
### coordinator returns only segment handles; the JDBC client fetches
### the segments itself via pre-signed URLs (retrieval-mode=STORAGE).

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
http-server.process-forwarded=true
http-server.authentication.allow-insecure-over-http=true

query.max-memory=28GB
query.max-memory-per-node=28GB

protocol.spooling.enabled=true
protocol.spooling.shared-secret-key=__SHARED_SECRET__

# STORAGE: client GETs the segment from VAST S3 directly using a
# pre-signed URL. Keeps result bytes off the coordinator entirely.
protocol.spooling.retrieval-mode=STORAGE

# Segments start small so the first rows reach the client quickly, then
# grow to amortize per-object overhead over the rest of the result set.
protocol.spooling.initial-segment-size=8MB
protocol.spooling.maximum-segment-size=64MB

# Small results still travel inline, avoiding an S3 round trip when
# spooling would cost more than it saves.
protocol.spooling.inlining.enabled=true
protocol.spooling.inlining.max-rows=1000
protocol.spooling.inlining.max-size=128kB
