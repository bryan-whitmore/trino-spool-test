### Filesystem spooling manager backed by a VAST S3 bucket.
### Only rendered for Profile B; Profile A runs without this file so the
### baseline has no spooling machinery loaded at all.

spooling-manager.name=filesystem
fs.s3.enabled=true
fs.location=__SPOOL_LOCATION__

# VAST S3 is path-style only -- there is no per-bucket DNS, so the bucket
# has to stay in the URI path rather than the hostname.
s3.endpoint=__S3_ENDPOINT__
s3.region=__S3_REGION__
s3.path-style-access=true
s3.aws-access-key=__S3_ACCESS_KEY__
s3.aws-secret-key=__S3_SECRET_KEY__

# Segment objects are written once and read once, so give the writer
# plenty of connections and a part size matched to the segment size.
s3.max-connections=200
s3.streaming.part-size=16MB

# Segments outlive only the query that produced them. Pruning sweeps up
# anything the client never acknowledged (failed or abandoned queries).
fs.segment.ttl=2h
fs.segment.pruning.enabled=true
fs.segment.pruning.interval=1m
fs.segment.pruning.batch-size=250

# The client tells us when it has the bytes, so segments are deleted on
# acknowledgement instead of waiting for the pruner.
fs.segment.explicit-ack=true

# Segment identifiers are already signed by the shared secret key; the
# payloads live in a private bucket, so skip the extra encryption layer.
fs.segment.encryption=false
