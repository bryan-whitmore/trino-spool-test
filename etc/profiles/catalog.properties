connector.name=vast
endpoint=__S3_ENDPOINT__
region=__S3_REGION__
access_key_id=__S3_ACCESS_KEY__
secret_access_key=__S3_SECRET_KEY__

# Must be raw CNode IPs. Per-CNode hostnames of the form
# ipv4-<ip>.main.<cluster>.<domain> are rejected: the connector addresses
# data endpoints virtual-host style, so the leading hostname label is parsed
# as a bucket name and every read 404s with NoSuchKey. Raw IPs keep the
# bucket in the URI path, which is the only form VAST S3 resolves.
# This applies to data_endpoints only -- the metadata endpoint above is
# fine as a hostname.
data_endpoints=__DATA_ENDPOINTS__

# Spread the scan across CNodes so the read side is not the bottleneck
# being measured.
num_of_splits=64
num_of_subsplits=10

vast.http-client.request-timeout=100h
vast.http-client.idle-timeout=290s
vast.http-client.max-connections-per-server=50
