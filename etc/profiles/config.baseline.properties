### Profile A -- BASELINE (classic Trino client protocol, no spooling)
### Result rows are serialized by the coordinator and paged to the JDBC
### client over /v1/statement. The coordinator is the sole data path.

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
http-server.process-forwarded=true
http-server.authentication.allow-insecure-over-http=true

query.max-memory=28GB
query.max-memory-per-node=28GB

protocol.spooling.enabled=false
